{{- if not .Values.existingSecret }}
{{- /* Generated once, then reused on every upgrade by reading the live Secret. Nothing is committed to git. */ -}}
{{- $name := include "mcp.secretName" . -}}
{{- $old := dict -}}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) }}{{ $old = .data }}{{ end -}}
{{- $fernet := randAlphaNum 32 | b64enc | replace "+" "-" | replace "/" "_" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mcp.labels" (dict "root" . "component" "secrets") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep      # `helm uninstall` must not silently destroy keys that encrypt stored data
type: Opaque
stringData:
  mariadb-root-password: {{ include "mcp.keep" (dict "old" $old "key" "mariadb-root-password" "gen" (randAlphaNum 24)) | quote }}
  mariadb-password: {{ include "mcp.keep" (dict "old" $old "key" "mariadb-password" "gen" (randAlphaNum 24)) | quote }}
  wp-admin-password: {{ include "mcp.keep" (dict "old" $old "key" "wp-admin-password" "gen" (randAlphaNum 20)) | quote }}
  woo-consumer-key: {{ include "mcp.keep" (dict "old" $old "key" "woo-consumer-key" "gen" (printf "ck_%s" (randAlphaNum 40 | lower))) | quote }}
  woo-consumer-secret: {{ include "mcp.keep" (dict "old" $old "key" "woo-consumer-secret" "gen" (printf "cs_%s" (randAlphaNum 40 | lower))) | quote }}
  mcp-woo-token: {{ include "mcp.keep" (dict "old" $old "key" "mcp-woo-token" "gen" (randAlphaNum 40)) | quote }}
  mcp-clock-token: {{ include "mcp.keep" (dict "old" $old "key" "mcp-clock-token" "gen" (randAlphaNum 40)) | quote }}
  mcp-notes-token: {{ include "mcp.keep" (dict "old" $old "key" "mcp-notes-token" "gen" (randAlphaNum 40)) | quote }}
  gateway-encryption-key: {{ include "mcp.keep" (dict "old" $old "key" "gateway-encryption-key" "gen" $fernet) | quote }}
  gateway-admin-password: {{ .Values.secrets.adminPassword | default (include "mcp.keep" (dict "old" $old "key" "gateway-admin-password" "gen" (randAlphaNum 20))) | quote }}
  llm-api-key: {{ .Values.secrets.llmApiKey | default (get $old "llm-api-key" | default "" | b64dec) | quote }}
{{- end }}
