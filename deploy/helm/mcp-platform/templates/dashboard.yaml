{{- $sel := dict "root" . "component" "dashboard" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dashboard
  labels: {{- include "mcp.labels" $sel | nindent 4 }}
spec:
  selector: {{- include "mcp.selector" $sel | nindent 4 }}
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
  labels: {{- include "mcp.labels" $sel | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels: {{- include "mcp.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mcp.labels" $sel | nindent 8 }}
    spec:
      automountServiceAccountToken: false   # no component talks to the Kubernetes API
      {{- include "mcp.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: dashboard
          image: {{ include "mcp.image" (dict "root" . "img" .Values.images.dashboard) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:                # nginx needs a few writable paths; everything else is locked down
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources: {{- toYaml .Values.dashboard.resources | nindent 12 }}
